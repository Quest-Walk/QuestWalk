[versions]
## Android gradle plugin
androidGradlePlugin = "8.7.3"

## AndroidX
# https://developer.android.com/jetpack/androidx/releases/activity
androidxActivity = "1.9.3"
# https://developer.android.com/jetpack/androidx/releases/lifecycle
androidxLifecycle = "2.8.7"

## Desugar Jdk
# https://github.com/google/desugar_jdk_libs/blob/master/CHANGELOG.md
androidDesugarJdkLibs = "2.1.4"

## Kotlin
# https://github.com/JetBrains/kotlin
kotlin = "2.1.0"

## Test
# https://github.com/junit-team/junit4
junit4 = "4.13.2"
# https://developer.android.com/jetpack/androidx/releases/test?hl=ko
androidxTestExt = "1.2.1"

## Kotlin Symbol Processing
# https://github.com/google/ksp/
kotlinxSerializationJson = "1.7.3"
ksp = "2.1.0-1.0.29"

## Coroutine
# https://github.com/Kotlin/kotlinx.coroutines
coroutine = "1.9.0"

## Compose
# https://developer.android.com/develop/ui/compose/bom/bom-mapping
composeBom = "2024.12.01"
# https://developer.android.com/jetpack/androidx/releases/compose-material3
composeMaterial3 = "1.3.1"
# https://developer.android.com/jetpack/androidx/releases/navigation
androidxComposeNavigation = "2.8.5"

## Hilt
# https://github.com/google/dagger/releases
hilt = "2.54"
# https://developer.android.com/jetpack/androidx/releases/hilt
hiltNavigationCompose = "1.2.0"

## Firebase
# https://firebase.google.com/docs/auth/android/start?hl=ko&_gl=1
googleGms = "4.4.2"
# https://firebase.google.com/docs/android/learn-more?authuser=0&hl=ko&_gl=1#bom
firebaseBoM = "33.7.0"

## Coil
# https://coil-kt.github.io/coil/
coil = "3.0.4"
coilLegacy = "2.7.0"

## Google identity
# https://developers.google.com/identity/android-credential-manager/releases?hl=ko
googleIdentity = "1.1.1"




