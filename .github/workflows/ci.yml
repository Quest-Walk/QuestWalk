name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev, 'refactor/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore local.properties
        run: echo "${{ secrets.LOCAL_PROPERTIES }}" | base64 --decode > local.properties

      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Unit test
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: '**/build/reports/tests/**'
          retention-days: 7

      - name: Clean up secrets
        if: always()
        run: rm -f local.properties app/google-services.json
